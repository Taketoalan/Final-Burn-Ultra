<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a26"/>
      <stop offset="0.55" stop-color="#081019"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af7ff"/>
      <stop offset="1" stop-color="#00a6c2"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="7" y="7" width="242" height="242" rx="50" fill="url(#bg)"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="49.5" fill="none"
        stroke="url(#neon)" stroke-width="3"/>
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none"
        stroke="#0a3d4d" stroke-width="2"/>

  <rect x="74" y="52" width="108" height="68" rx="12" fill="#09141e"
        stroke="#00c8df" stroke-width="3"/>
  <rect x="86" y="64" width="84" height="44" rx="6" fill="#041016"
        stroke="#0b3947" stroke-width="2"/>
  <circle cx="128" cy="86" r="8" fill="#ff7a18" filter="url(#glow)"/>
  <path d="M96 96 L112 82 L128 96 L144 82 L160 96" fill="none"
        stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.7"/>

  <ellipse cx="98" cy="160" rx="27" ry="11" fill="#071019" stroke="#00c8df" stroke-width="3"/>
  <rect x="95" y="132" width="6" height="28" rx="3" fill="#9fb8c8"/>
  <circle cx="98" cy="124" r="14" fill="url(#hot)" stroke="#ffd166" stroke-width="3"
          filter="url(#glow)"/>

  <circle cx="146" cy="150" r="9" fill="#00e5ff" opacity="0.9"/>
  <circle cx="168" cy="158" r="8" fill="#ffd166" opacity="0.9"/>
  <circle cx="182" cy="142" r="7" fill="#ff5d73" opacity="0.9"/>

  <text x="128" y="208" text-anchor="middle" font-family="DejaVu Sans, Sans, sans-serif"
        font-size="25" font-weight="bold" fill="#eaf7ff" letter-spacing="3">FB NEO</text>
  <text x="128" y="232" text-anchor="middle" font-family="DejaVu Sans, Sans, sans-serif"
        font-size="13" font-weight="bold" fill="#00e5ff" letter-spacing="7">ULTRA</text>
</svg>
